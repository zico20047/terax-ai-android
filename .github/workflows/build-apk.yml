name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - rust_target: aarch64-linux-android
            tauri_target: aarch64
            ndk_prefix: aarch64-linux-android
            abi: arm64-v8a
            bootstrap_arch: aarch64
            apk_suffix: arm64
          - rust_target: x86_64-linux-android
            tauri_target: x86_64
            ndk_prefix: x86_64-linux-android
            abi: x86_64
            bootstrap_arch: x86_64
            apk_suffix: x64
          - rust_target: armv7-linux-androideabi
            tauri_target: armv7
            ndk_prefix: armv7a-linux-androideabi
            abi: armeabi-v7a
            bootstrap_arch: arm
            apk_suffix: arm32
          - rust_target: i686-linux-android
            tauri_target: i686
            ndk_prefix: i686-linux-android
            abi: x86
            bootstrap_arch: i686
            apk_suffix: x86
    fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;29.0.13846066" || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ matrix.rust_target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.rust_target }}-

      - name: Install dependencies
        run: pnpm install
        env:
          PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"

      - name: Download bootstrap zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p src-tauri/bootstrap-zips
          mkdir -p src-tauri/gen/android/app/src/main/jniLibs/${{ matrix.abi }}
          gh release download bootstrap-v15 \
            --repo zico20047/terax-ai-android \
            --pattern "bootstrap-${{ matrix.bootstrap_arch }}.zip" \
            --dir src-tauri/bootstrap-zips \
            --clobber
          SIZE=$(stat -c%s src-tauri/bootstrap-zips/bootstrap-${{ matrix.bootstrap_arch }}.zip)
          echo "Bootstrap zip size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: Bootstrap zip too small ($SIZE bytes)!"
            exit 1
          fi
          echo "OK: bootstrap zip verified ($SIZE bytes)"

      - name: Compile LD_PRELOAD library
        run: |
          TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          $TOOLCHAIN/${{ matrix.ndk_prefix }}28-clang \
            -shared -fPIC -O2 \
            -o src-tauri/gen/android/app/src/main/jniLibs/${{ matrix.abi }}/libterax-path-translate.so \
            src-tauri/src/modules/path-translate/path-translate.c

      - name: Build APK
        run: pnpm tauri android build --debug --apk --target ${{ matrix.tauri_target }}

      - name: Rename APK
        run: |
          cp src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk \
            terax-android-${{ github.ref_name || 'testing' }}-${{ matrix.apk_suffix }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: terax-android-${{ matrix.apk_suffix }}
          path: terax-android-*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/terax-android-*.apk
          generate_release_notes: true
          tag_name: ${{ github.ref_name || 'testing' }}
          prerelease: ${{ contains(github.ref_name, 'testing') || contains(github.ref_name, 'beta') || github.event_name == 'workflow_dispatch' }}
